# Jupyter Book 1.x configuration. Build with: jupyter-book build .
title: LLM Embeddings in Psychology
author: Leonardo Zaggia
copyright: "2026"
logo: images/logo.png
only_build_toc_files: true

# Notebooks are committed with their outputs and are NOT re-executed at build time,
# so the GitHub Pages build does not need torch or a model download.
execute:
  execute_notebooks: "off"

# Set this to the public repository that hosts the book. The Colab launch button on every
# chapter is built from it: <colab_url>/github/<owner>/<repo>/blob/<branch>/<file>.ipynb
repository:
  url: https://github.com/leonardozaggia/PONS_material
  path_to_book: ""
  branch: main

launch_buttons:
  notebook_interface: classic
  colab_url: "https://colab.research.google.com"

html:
  favicon: images/favicon.png
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true

sphinx:
  config:
    html_show_copyright: false
    myst_heading_anchors: 3
    # Hide progress-bar chatter (stderr) from the rendered pages; it stays in the notebook for Colab users.
    nb_output_stderr: remove
    # Solutions are exported to static HTML before the build and copied into the site unlisted (see README)
    html_extra_path: ["_solutions_html"]
